<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Onglets</title>
<style>
  :root { --bg: #0b0b0d; --tab: #16161a; --tab-hover: #1d1d22; --line: #232329; --text: #f2f2f4; --muted: #8d8d97; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text); user-select: none;
    font: 13px/1 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: stretch; border-bottom: 1px solid var(--line);
  }
  #tabs { display: flex; align-items: flex-end; gap: 4px; padding: 6px 6px 0; min-width: 0; flex: 1; overflow: hidden; }
  .tab {
    position: relative; display: flex; align-items: center; gap: 8px;
    height: 33px; min-width: 64px; max-width: 210px; flex: 0 1 210px; padding: 0 8px 0 12px;
    border-radius: 9px 9px 0 0; background: transparent; color: var(--muted); cursor: default;
    transition: background .12s, color .12s;
  }
  .tab:hover { background: var(--tab-hover); color: var(--text); }
  .tab.active { background: var(--tab); color: var(--text); }
  .tab.active::after {
    content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 2px; background: var(--accent);
  }
  .tab.dragging { opacity: .55; }
  .tab.detach { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--accent); }
  .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .icon {
    flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    color: var(--muted); background: none; border: 0; cursor: pointer;
  }
  .icon:hover { background: #ffffff14; color: var(--text); }
  .close { opacity: 0; }
  .tab:hover .close, .tab.active .close { opacity: 1; }
  .sound { color: var(--accent); }
  .sound.muted { color: var(--muted); }
  .nav {
    align-self: center; flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
    background: none; border: 0; color: var(--muted); cursor: pointer;
  }
  .nav:first-child { margin-left: 2px; }
  .nav:hover:not(:disabled) { background: #ffffff14; color: var(--text); }
  .nav:disabled { opacity: .3; cursor: default; }
  /* lecteur compact à droite */
  #np { display: none; align-items: center; gap: 2px; min-width: 0; max-width: 340px; margin-right: 4px; }
  #np.show { display: flex; }
  #np .info {
    min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 0 8px 0 6px; cursor: pointer;
    border-radius: 7px; line-height: 1.15;
  }
  #np .info:hover { background: #ffffff0c; }
  #np .t { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  #np .a { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #np .a b { color: var(--npaccent); font-weight: 600; }
  #np .mb {
    flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    background: none; border: 0; color: var(--text); cursor: pointer;
  }
  #np .mb:hover:not(:disabled) { background: #ffffff16; }
  #np .mb:disabled { opacity: .3; cursor: default; }
  #np .mb.play { width: 30px; height: 30px; background: var(--npaccent); color: #0b0b0d; }
  #np .mb.play:hover { filter: brightness(1.12); background: var(--npaccent); }
  #home {
    align-self: center; flex: none; display: flex; align-items: center; gap: 7px;
    height: 30px; padding: 0 10px; margin: 0 4px 0 2px; border-radius: 8px;
    color: var(--muted); background: none; border: 0; font: inherit; font-weight: 600; cursor: pointer;
  }
  #home:hover { background: #ffffff14; color: var(--text); }
  #home.on { background: #ffffff12; color: var(--text); }
  #home .lbl { font-size: 12.5px; }
  body.classic .tab { flex: 0 1 240px; }
  #plus { align-self: center; width: 30px; height: 30px; margin-left: 2px; border-radius: 8px; }
  #right { display: flex; align-items: center; gap: 6px; padding: 0 8px; }
  #attachAll {
    display: none; height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #ffffff0a; color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
  }
  #attachAll:hover { background: #ffffff16; }
  body.detached #attachAll { display: inline-flex; align-items: center; gap: 6px; }
  .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tool {
    flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
    background: none; border: 0; color: var(--muted); cursor: pointer;
  }
  .tool:hover { background: #ffffff14; color: var(--text); }
  .tool.on { color: var(--text); background: #ffffff12; }
  /* mode flottant : barre fine, seulement le titre et de quoi revenir */
  #floatbar { display: none; flex: 1; align-items: center; gap: 6px; padding: 0 4px 0 10px; min-width: 0; -webkit-app-region: drag; }
  #floatbar .ft { flex: 1; min-width: 0; font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  #floatbar button { -webkit-app-region: no-drag; }
  #floatbar .tool { width: 24px; height: 24px; border-radius: 6px; }
  body.floating #tabs, body.floating #right { display: none; }
  body.floating #floatbar { display: flex; }
</style>
</head>
<body>
  <div id="tabs"></div>
  <div id="floatbar">
    <span class="ft" id="floatTitle"></span>
    <button class="tool" id="floatPlay" title="Lecture / pause">
      <svg id="floatIco" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="tool" id="floatExit" title="Quitter le mode flottant (Ctrl+Maj+F)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    </button>
  </div>
  <div id="right">
    <div id="np">
      <button class="mb" id="npPrev" title="Précédent">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="mb play" id="npToggle" title="Lecture / pause">
        <svg id="npIco" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="mb" id="npNext" title="Suivant">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg>
      </button>
      <div class="info" id="npInfo" title="Aller à l'onglet qui joue">
        <span class="t" id="npTitle"></span>
        <span class="a" id="npArtist"></span>
      </div>
    </div>
    <span class="hint" id="hint"></span>
    <button class="tool" id="floatBtn" title="Mode flottant : petite fenêtre toujours au premier plan (Ctrl+Maj+F)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="tool" id="fsBtn" title="Plein écran (F11)">
      <svg id="fsIco" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="attachAll" title="Remettre cet onglet dans la fenêtre principale">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 14l-5-5 5-5M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
      Rattacher
    </button>
  </div>
<script>
  const $ = id => document.getElementById(id);
  const ICON_X = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const ICON_SOUND = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const ICON_MUTED = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const ICON_PLUS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>';
  const ICON_BACK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
  const ICON_FWD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const ICON_RELOAD = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>';
  const ICON_HOME = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>';
  let st = { tabs: [], active: null, main: true, tabsMode: false };

  function render() {
    const classic = st.main && !st.tabsMode;
    document.body.classList.toggle('detached', !st.main);
    document.body.classList.toggle('classic', classic);
    const box = $('tabs');
    box.replaceChildren();

    // Retour / Suivant sur la page affichée
    const nav = st.nav || {};
    const back = document.createElement('button');
    back.className = 'nav'; back.innerHTML = ICON_BACK; back.disabled = !nav.back;
    back.title = 'Retour (Alt+←)';
    back.onclick = () => window.tabs.back();
    const fwd = document.createElement('button');
    fwd.className = 'nav'; fwd.innerHTML = ICON_FWD; fwd.disabled = !nav.forward;
    fwd.title = 'Suivant (Alt+→)';
    fwd.onclick = () => window.tabs.forward();
    const rl = document.createElement('button');
    rl.className = 'nav'; rl.innerHTML = ICON_RELOAD; rl.id = 'reload';
    rl.disabled = !(activeTabOf() && !activeTabOf().picker);
    rl.title = 'Actualiser la page (F5)';
    rl.onclick = () => window.tabs.reload();
    box.append(back, fwd, rl);

    // bouton Accueil : écran de choix, sans fermer ce qui joue
    const activeTab = st.tabs.find(t => t.key === st.active);
    const home = document.createElement('button');
    home.id = 'home';
    home.className = activeTab && activeTab.picker ? 'on' : '';
    home.title = 'Accueil — choisir une plateforme (Ctrl+Maj+P)\nLa page en cours reste ouverte derrière.';
    home.innerHTML = ICON_HOME + '<span class="lbl">Accueil</span>';
    home.onclick = () => window.tabs.home();
    box.append(home);

    // en mode classique : seulement la plateforme ouverte (clic = y revenir), pas d'onglet « accueil »
    const shown = classic ? st.tabs.filter(t => !t.picker) : st.tabs;
    shown.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'tab' + (t.key === st.active ? ' active' : '');
      el.style.setProperty('--accent', t.accent);
      el.dataset.key = t.key;
      el.title = (t.platform && t.platform !== t.name ? t.platform + ' — ' : '') + t.name
        + (st.main && !t.picker ? '\n(glisse vers le bas pour le détacher)' : '');

      const dot = document.createElement('span'); dot.className = 'dot';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = t.name;
      el.append(dot, name);

      if (t.audible || t.muted) {
        const s = document.createElement('button');
        s.className = 'icon sound' + (t.muted ? ' muted' : '');
        s.innerHTML = t.muted ? ICON_MUTED : ICON_SOUND;
        s.title = t.muted ? 'Remettre le son' : 'Couper le son de cet onglet';
        s.onpointerdown = e => e.stopPropagation();
        s.onclick = e => { e.stopPropagation(); window.tabs.mute(t.key); };
        el.append(s);
      }
      if (classic) {
        el.title = t.name;
        el.onclick = () => window.tabs.activate(t.key);
        box.append(el);
        return;
      }
      const x = document.createElement('button');
      x.className = 'icon close'; x.innerHTML = ICON_X; x.title = 'Fermer (Ctrl+W)';
      x.onpointerdown = e => e.stopPropagation();
      x.onclick = e => { e.stopPropagation(); window.tabs.close(t.key); };
      el.append(x);

      el.onauxclick = e => { if (e.button === 1) window.tabs.close(t.key); };
      el.oncontextmenu = e => { e.preventDefault(); window.tabs.menu(t.key); };
      dragify(el, t, st.tabs.indexOf(t));
      box.append(el);
    });
    if (!classic && (st.main || st.tabs.length)) {
      const plus = document.createElement('button');
      plus.id = 'plus'; plus.className = 'icon'; plus.innerHTML = ICON_PLUS; plus.title = 'Nouvel onglet (Ctrl+T)';
      plus.onclick = () => window.tabs.newTab();
      box.append(plus);
    }
    $('hint').textContent = '';
    document.body.classList.toggle('floating', !!st.floating);
    $('floatBtn').classList.toggle('on', !!st.floating);
    $('fsBtn').classList.toggle('on', !!st.fullscreen);
    $('fsBtn').title = st.fullscreen ? 'Quitter le plein écran (F11 ou Échap)' : 'Plein écran (F11)';
    $('fsIco').innerHTML = st.fullscreen
      ? '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>'
      : '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>';
    const act = activeTabOf();
    $('floatTitle').textContent = act ? act.name : 'Pellicule';
  }

  // Clic = activer ; glisser à gauche/droite = réordonner ; glisser vers le bas = détacher dans une fenêtre.
  function dragify(el, t, index) {
    el.onpointerdown = e => {
      if (e.button !== 0) return;
      const startX = e.clientX, startY = e.clientY;
      let moved = false, detachIntent = false;
      el.setPointerCapture(e.pointerId);
      window.tabs.activate(t.key);

      el.onpointermove = ev => {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!moved && Math.hypot(dx, dy) < 6) return;
        moved = true;
        el.classList.add('dragging');
        const canDetach = !t.picker && (st.main || st.tabs.length > 1);
        detachIntent = canDetach && dy > 28;
        el.classList.toggle('detach', detachIntent);
        $('hint').textContent = detachIntent ? 'Relâche pour ouvrir dans une nouvelle fenêtre' : '';
        el.style.transform = detachIntent ? 'none' : `translateX(${dx}px)`;
      };
      let last = e, done = false;
      const finish = ev => {
        if (done) return;
        done = true;
        el.onpointermove = el.onpointerup = el.onlostpointercapture = null;
        el.classList.remove('dragging', 'detach');
        el.style.transform = '';
        $('hint').textContent = '';
        if (!moved) return;
        if (detachIntent) { window.tabs.detach(t.key, ev.screenX, ev.screenY); return; }
        // réordonner : nouvel emplacement selon la position du curseur
        const others = [...document.querySelectorAll('.tab')].filter(x => x !== el);
        let to = others.findIndex(o => { const r = o.getBoundingClientRect(); return ev.clientX < r.left + r.width / 2; });
        if (to < 0) to = others.length;
        if (to !== index) window.tabs.move(t.key, to);
      };
      const move = el.onpointermove;
      el.onpointermove = ev => { last = ev; move(ev); };
      el.onpointerup = ev => finish(ev);
      // si on relâche hors de la barre, on reçoit seulement la perte de capture
      el.onlostpointercapture = () => finish(last);
    };
  }

  $('attachAll').onclick = () => { const a = st.tabs.find(t => t.key === st.active) || st.tabs[0]; if (a) window.tabs.attach(a.key); };
  function activeTabOf() { return st.tabs.find(t => t.key === st.active); }

  // lecteur compact : morceau en cours (n'importe quel onglet) + précédent / pause / suivant
  const PLAY_PATH = '<path d="M8 5v14l11-7z"/>', PAUSE_PATH = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  function renderNp() {
    const np = st.np;
    $('np').classList.toggle('show', !!np);
    $('floatPlay').style.display = np ? '' : 'none';
    if (!np) return;
    document.documentElement.style.setProperty('--npaccent', np.accent || '#33ffee');
    $('npTitle').textContent = np.title;
    $('npArtist').innerHTML = '';
    const pf = document.createElement('b'); pf.textContent = np.platform;
    $('npArtist').append(pf, document.createTextNode(np.artist ? ' · ' + np.artist : ''));
    $('npIco').innerHTML = np.playing ? PAUSE_PATH : PLAY_PATH;
    $('npToggle').title = np.playing ? 'Pause' : 'Lecture';
    $('npPrev').disabled = !np.prev;
    $('npNext').disabled = !np.next;
    $('floatIco').innerHTML = np.playing ? PAUSE_PATH : PLAY_PATH;
  }
  $('npPrev').onclick = () => window.tabs.media('previoustrack');
  $('npToggle').onclick = () => window.tabs.media('toggle');
  $('npNext').onclick = () => window.tabs.media('nexttrack');
  $('npInfo').onclick = () => window.tabs.showPlaying();
  $('floatBtn').onclick = () => window.tabs.floating();
  $('floatExit').onclick = () => window.tabs.floating();
  $('floatPlay').onclick = () => window.tabs.media('toggle');
  $('fsBtn').onclick = () => window.tabs.fullscreen();

  window.tabs.onState(s => { st = s; render(); renderNp(); });
</script>
</body>
</html>
